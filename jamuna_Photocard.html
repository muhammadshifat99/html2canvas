<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamuna TV PhotoCard</title>
</head>

<body>
    <style>
        .card {
            height: 400px;
            width: 400px;
            background: #B7000C;
            position: relative;
            margin: 0;
            padding: 0;
        }

        .card img {
            width: 100%;
        }

        .footer {
            position: absolute;
            background: linear-gradient(#D70007, #8D0000);
            bottom: 10%;
            width: 100%;
        }

        .footer img {
            width: 25%;
            padding-left: 3%;

        }

        .footer .bread {
            display: inline-block;
            padding-left: 2.4%;
            font-size: 16px;
            color: #ffffffb7;
        }

        .bread span {
            font-size: 22px;
        }
        .fb{
            display: inline-block;
            
        }

        .fb img {
            width: 22px;
        }

        .ad {
            position: absolute;
            bottom: 0;
            margin: 0;
            padding: 0;
        }

        .ad img {
            bottom: 0;
        }
    </style>
    <div class="card">
        <img src="redflag.webp" alt="">
        <div class="footer">
            <img src="logo.png" alt="">
            <div class="bread"><span>&#129170;</span> Jamuna TV</div>
            <div class="fb"><img src="facebook-new.png" alt=""></div>
        </div>
        <div class="ad">
            <img src="ad.png" alt="">
        </div>
    </div>
</body>

</html>
